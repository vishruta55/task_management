services:
  - type: web
    name: task-managing
    env: python
    pythonVersion: "3.11.9"
    buildCommand: python -m pip install -r requirements.txt && npm --prefix frontend install && npm --prefix frontend run build && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate && python manage.py seed_admin
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --log-file -
    healthCheckPath: /api/session/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_TIMEOUT
        value: "5"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SQLITE_DB_PATH
        value: /var/data/db.sqlite3
      - key: DATABASE_URL
        sync: false
    disk:
      name: task-management-data
      mountPath: /var/data
      sizeGB: 1
