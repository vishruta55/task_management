services:
  - type: web
    name: task-management
    env: python
    pythonVersion: "3.11.9"
    buildCommand: python -m pip install -r requirements.txt && npm --prefix frontend install && npm --prefix frontend run build && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --log-file -
    healthCheckPath: /api/session/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
